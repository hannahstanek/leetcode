name: Sync LeetCode

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  schedule:
    - cron: "0 * * * *"     # hourly (GitHub may delay scheduled runs by a few min)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync LeetCode submissions
        uses: joshcai/leetcode-sync@v1.7
        with:
          # Personal token (not the default GITHUB_TOKEN) so commits are
          # attributed to you and count on your contribution graph.
          github-token: ${{ secrets.LEETCODE_GH_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          verbose: true
          commit-header: "Add LeetCode submission"
